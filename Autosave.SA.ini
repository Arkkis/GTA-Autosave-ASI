; GTA Autosave - San Andreas Configuration

; Enable debug mode (0 = disabled, 1 = enabled)
Debug = 0

; Autosave when approaching a mission marker (0 = disabled, 1 = enabled)
ApproachAutosave = 1

; Autosave after completing a mission (0 = disabled, 1 = enabled)
MissionCompleteAutosave = 1

; Controller buttons that answer the mission retry prompt (keyboard Y / N always work too).
; Accepted names: None, DPadUp, DPadDown, DPadLeft, DPadRight, Start, Back,
; LeftThumb, RightThumb, LeftShoulder, RightShoulder, A, B, X, Y
ControllerRetryYes = DPadRight
ControllerRetryNo = DPadLeft
